before_script:
    # Install build dependencies
    - apt-get update && apt-get -y install cmake gfortran mpich

build_gfortran:
   stage: build
   script:
      - mkdir build
      - cd build
      - FC=gfortran cmake ../src
      - make

test_standalone:
    stage: test
    script:
        - git clone git@src.ipp.kfa-juelich.de:eirene/EIRENE-sample-cases.git