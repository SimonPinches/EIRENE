######################################################################################
# Coverage
######################################################################################

coverage_report:
    stage: coverage
    rules:
        - when: always
        - if: $CI_COMMIT_REF_NAME == 'develop'
        - if: $CI_COMMIT_REF_NAME == 'master'
        - if: $CI_PIPELINE_SOURCE == 'schedule'
          when: never
    before_script:
        # Bypass mpirun abort due to execution as root
        - export MPIRUN_FLAGS='--allow-run-as-root'
    script:
        - mkdir buildCoverage
        - cd buildCoverage
        - FC=mpif90 cmake ../src -DCMAKE_BUILD_TYPE=Coverage
        - make EIRENE
        - cd ..
        - mkdir EIRENE-sample-cases
        - cd EIRENE-sample-cases
        - git init
        - git remote add origin https://gitlab-ci-token:${CI_JOB_TOKEN}@${SERVER_DOMAIN}/eirene/EIRENE-sample-cases.git
        - git fetch --depth 1 origin ${SAMPLE_CASE_VERSION}	
        - git checkout FETCH_HEAD
        - make coverageReport FFLAGS="-g -fprofile-arcs -ftest-coverage" CONFIG=Coverage
    dependencies: []
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
            - EIRENE-sample-cases/coverage.info
            - EIRENE-sample-cases/coverageReport

######################################################################################
# OpenMP tests
######################################################################################

build_openmp_library:
    stage: preparation:openmp
    rules:
        - if: $CI_PIPELINE_SOURCE == 'schedule'
          when: never
        - if: $EXCLUDE_OPENMP == 'true'
          when: never
        - when: always
    script:
        - mkdir -p buildRelease
        - cd buildRelease
        - rm -rf ./*
        - FC=mpif90 cmake -DOPENMP=ON ../src
        - make clean
        - make -j EIRENE
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
            - buildRelease/
            - libRelease/

prepare_openmp_testcases:
    stage: preparation:openmp
    rules:
        - if: $CI_PIPELINE_SOURCE == 'schedule'
          when: never
        - if: $EXCLUDE_OPENMP == 'true'
          when: never
        - when: always
    script:
        # Make only shallow clone (fetch) of single commit defined by SHA key 
        - mkdir -p EIRENE-sample-cases
        - cd EIRENE-sample-cases
        - git init
        - git remote add origin https://gitlab-ci-token:${CI_JOB_TOKEN}@${SERVER_DOMAIN}/eirene/EIRENE-sample-cases.git
        - git fetch --depth 1 origin ${SAMPLE_CASE_VERSION_OPENMP}
        - git checkout FETCH_HEAD
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
            - EIRENE-sample-cases
        exclude:
            - EIRENE-sample-cases/.git/**      

.build_openmp_executable: &build_openmp_executable
    stage: build:openmp_executable
    rules:
        - if: $CI_PIPELINE_SOURCE == 'schedule'
          when: never
        - if: $EXCLUDE_OPENMP == 'true'
          when: never
        - when: always
    script:
        - cd EIRENE-sample-cases/${PATH_CASE}
        - make
    retry: 2
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
            - buildRelease/
            - libRelease/
            - binRelease/
            - EIRENE-sample-cases/${PATH_CASE}
    needs:
        - build_openmp_library
        - prepare_openmp_testcases

.build_iter_openmp_executable: &build_iter_openmp_executable
    stage: build:openmp_executable
    rules:
        - if: $CI_PIPELINE_SOURCE == 'schedule'
          when: never
        - if: $EXCLUDE_OPENMP == 'true'
          when: never
        - when: always
    script:
        - cd EIRENE-sample-cases/${PATH_CASE}
        - make -j
    retry: 2
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
            - buildRelease/
            - binRelease/
            - EIRENE-sample-cases/${PATH_CASE}
    needs:
        - build_openmp_library
        - prepare_openmp_testcases

.run_openmp: &run_openmp
    stage: run_openmp
    rules:
        - if: $CI_PIPELINE_SOURCE == 'schedule'
          when: never
        - if: $EXCLUDE_OPENMP == 'true'
          when: never
        - when: always
    script:
        - cd EIRENE-sample-cases/${PATH_CASE}
        - export OMP_NUM_THREADS=4
        - make output
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
            - buildRelease/
            - libRelease/
            - EIRENE-sample-cases/${PATH_CASE}
        when: always
    needs:
        - build_openmp_library

.test_openmp: &test_openmp
    stage: test_openmp
    rules:
        - if: $CI_PIPELINE_SOURCE == 'schedule'
          when: never
        - if: $EXCLUDE_OPENMP == 'true'
          when: never
        - when: always
    script:
        - python3 --version
        - cd EIRENE-sample-cases/${PATH_CASE}
        - export OMP_NUM_THREADS=4
        - make test_openmp
    retry: 2

