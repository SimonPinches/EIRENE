image: gcc

before_script:
    # Install build dependencies
    - apt-get update && apt-get -y install cmake openmpi-bin

build_gfortran:
    stage: build
    script:
        - mkdir build
        - cd build
        - FC=gfortran cmake ../src
        - make
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
        - build/*.mod
        - lib/

test_standalone:
    stage: test
    script:
        - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@src.ipp.kfa-juelich.de/eirene/EIRENE-sample-cases.git
        - cd EIRENE-sample-cases
        - git checkout buildSystem
        - cd 1D-H_slab
        - make test
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
        - EIRENE-sample-cases/1D-H_slab/output/