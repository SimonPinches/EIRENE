image: debian

include:
    - '.update_fork_branches.yml'
    - '.tag_and_deploy.yml'

before_script:
    # Install required programs
    - apt-get update && apt-get -y install cmake openmpi-bin libopenmpi-dev gfortran git makedepf90 xxd
    # Bypass mpirun abort due to execution as root
    - export MPIRUN_FLAGS='--allow-run-as-root'

stages:
    - build:library
    - build:executable
    - run
    - test
    - tag
    - deploy
    - on-schedule

.build_executable: &build_executable
    stage: build:executable
    except: 
        - schedules
    script:
        - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@src.ipp.kfa-juelich.de/eirene/EIRENE-sample-cases.git
        - cd EIRENE-sample-cases/${PATH_CASE}
        - git checkout feature/NLSHRT13
        - make
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
            - EIRENE-sample-cases/${PATH_CASE}

.run: &run
    stage: run
    except: 
        - schedules
    script:
        - cd EIRENE-sample-cases/${PATH_CASE}
        - make output
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
            - EIRENE-sample-cases/${PATH_CASE}
        when: always

.test: &test
    stage: test
    except: 
        - schedules
    script:
        - cd EIRENE-sample-cases/${PATH_CASE}
        - make test
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
            - EIRENE-sample-cases/${PATH_CASE}/output/
        when: on_failure

build_library:
    stage: build:library
    except: 
        - schedules
    script:
        - mkdir build
        - cd build
        - FC=gfortran cmake ../src
        - make EIRENE
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
            - build/*.mod
            - lib/

build_standalone_1D_slab:
    <<: *build_executable
    variables:
        PATH_CASE: "1D-H_slab"

run_standalone_1D-H_slab:
    <<: *run
    variables:
        PATH_CASE: "1D-H_slab"
    dependencies:
        - build_standalone_1D_slab

test_standalone_1D-H_slab:
    <<: *test
    variables:
        PATH_CASE: "1D-H_slab"
    dependencies:
        - run_standalone_1D-H_slab

build_standalone_1D_slab_with_farming:
    <<: *build_executable
    variables:
        PATH_CASE: "1D-H_slab_with_farming"
    only:
        - PB/feature/farming

run_standalone_1D-H_slab_with_farming:
    <<: *run
    variables:
        PATH_CASE: "1D-H_slab_with_farming"
    only:
        - PB/feature/farming
    dependencies:
        - build_standalone_1D_slab_with_farming

test_standalone_1D-H_slab_with_farming:
    <<: *test
    variables:
        PATH_CASE: "1D-H_slab_with_farming"
    only:
        - PB/feature/farming
    dependencies:
        - run_standalone_1D-H_slab_with_farming

