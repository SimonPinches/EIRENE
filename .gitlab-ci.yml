image: debian

include: '.update_fork_branches.yml'

before_script:
    # Install required programs
    - apt-get update && apt-get -y install cmake openmpi-bin libopenmpi-dev gfortran git makedepf90 xxd
    # Bypass mpirun abort due to execution as root
    - export MPIRUN_FLAGS='--allow-run-as-root'

stages:
    - build:library
    - build:executable
    - run
    - test
    - on-schedule

build_library:
    stage: build:library
    except: 
        - schedules
    script:
        - mkdir build
        - cd build
        - FC=gfortran cmake ../src
        - make EIRENE
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
        - build/*.mod
        - lib/

build_standalone_1D_slab:
    stage: build:executable
    except: 
        - schedules
    script:
        - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@src.ipp.kfa-juelich.de/eirene/EIRENE-sample-cases.git
        - cd EIRENE-sample-cases/1D-H_slab
        - make
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
        - EIRENE-sample-cases/1D-H_slab/

run_standalone_1D-H_slab:
    stage: run
    except: 
        - schedules
    script:
        - cd EIRENE-sample-cases/1D-H_slab
        - make output
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
        - EIRENE-sample-cases/1D-H_slab/
        when: always
    dependencies:
    - build_standalone_1D_slab

test_standalone_1D-H_slab:
    stage: test
    except: 
        - schedules
    script:
        - cd EIRENE-sample-cases/1D-H_slab
        - make test
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
        - EIRENE-sample-cases/1D-H_slab/output/
        when: on_failure
    dependencies:
    - run_standalone_1D-H_slab

