coverage_report:
    stage: coverage
    only:
        - develop
        - master
    except:
        - schedules
    before_script:
        # Bypass mpirun abort due to execution as root
        - export MPIRUN_FLAGS='--allow-run-as-root'
    script:
        - mkdir buildCoverage
        - cd buildCoverage
        - FC=mpif90 cmake ../src -DCMAKE_BUILD_TYPE=Coverage
        - make EIRENE
        - cd ..
        - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@${SERVER_DOMAIN}/eirene/EIRENE-sample-cases.git
        - cd EIRENE-sample-cases
        - git checkout ${SAMPLE_CASE_VERSION}
        - make coverageReport FFLAGS="-g -fprofile-arcs -ftest-coverage" CONFIG=Coverage
    dependencies: []
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
            - EIRENE-sample-cases/coverage.info
            - EIRENE-sample-cases/coverageReport

build_openmp_library:
    stage: preparation:openmp
    only:
        variables:
#            - $CI_COMMIT_REF_NAME == 'develop'
#            - $CI_COMMIT_REF_NAME == 'master'
            - $INCLUDE_OPENMP == 'true'
    except: 
        - schedules
    script:
        - rm -rf buildRelease
        - mkdir buildRelease
        - cd buildRelease
        - FC=mpif90 cmake ../src -DOPENMP=ON
        - make clean
        - make EIRENE
        - FC=mpif90 cmake ../src -DEIRENE_INTERFACE=SOLPS-ITER -DEIRENE_USER-ROUTINES=iter -DEIRENE_POSTFIX=_iter -DOPENMP=ON
        - make EIRENE
        - FC=mpif90 cmake ../src -DEIRENE_INTERFACE=B2 -DEIRENE_USER-ROUTINES=default -DEIRENE_POSTFIX=_poly -DOPENMP=ON
        - make EIRENE
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
            - buildRelease/
            - libRelease/

.build_openmp_executable: &build_openmp_executable
    stage: build:openmp_executable
    only:
        variables:
#            - $CI_COMMIT_REF_NAME == 'develop'
#            - $CI_COMMIT_REF_NAME == 'master'
            - $INCLUDE_OPENMP == 'true'
    except: 
        - schedules
    script:
        - cd EIRENE-sample-cases/${PATH_CASE}
        - make clean
        - make
    retry: 2
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
            - buildRelease/
            - libRelease/
            - EIRENE-sample-cases/${PATH_CASE}

.run_openmp: &run_openmp
    stage: run_openmp
    only:
        variables:
#            - $CI_COMMIT_REF_NAME == 'develop'
#            - $CI_COMMIT_REF_NAME == 'master'
            - $INCLUDE_OPENMP == 'true'
    except: 
        - schedules
    script:
        - cd EIRENE-sample-cases/${PATH_CASE}
        - export OMP_NUM_THREADS=4
        - make output
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
            - buildRelease/
            - libRelease/
            - EIRENE-sample-cases/${PATH_CASE}
        when: always
    needs:
        - build_openmp_library

.test_openmp: &test_openmp
    stage: test_openmp
    only:
        variables:
#            - $CI_COMMIT_REF_NAME == 'develop'
#            - $CI_COMMIT_REF_NAME == 'master'
            - $INCLUDE_OPENMP == 'true'
    except: 
        - schedules
    script:
        - python --version
        - cd EIRENE-sample-cases/${PATH_CASE}
        - export OMP_NUM_THREADS=4
        - make test_openmp

