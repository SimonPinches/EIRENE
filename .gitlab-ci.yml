image: debian

before_script:
    # Install required programs
    - apt-get update && apt-get -y install cmake openmpi-bin libopenmpi-dev gfortran git makedepf90 xxd

stages:
    - build:library
    - build:executable
    - test

build_library:
    stage: build:library
    script:
        - mkdir build
        - cd build
        - FC=gfortran cmake ../src
        - make EIRENE
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
        - build/*.mod
        - lib/

build_standalone_1D_slab:
    stage: build:executable
    script:
        - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@src.ipp.kfa-juelich.de/eirene/EIRENE-sample-cases.git
        - cd EIRENE-sample-cases/1D-H_slab
        - make
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
        - EIRENE-sample-cases/1D-H_slab/

test_standalone_1D-H_slab:
    stage: test
    script:
        - cd EIRENE-sample-cases/1D-H_slab
        - make test
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
        - EIRENE-sample-cases/1D-H_slab/output/
        when: on_failure
    dependencies:
    - build_standalone_1D_slab

build_standalone_1D_slab_with_farming:
    stage: build:executable
    only:
        - PB/feature/farming
    script:
        - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@src.ipp.kfa-juelich.de/eirene/EIRENE-sample-cases.git
        - cd EIRENE-sample-cases/1D-H_slab_with_farming
        - make
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
        - EIRENE-sample-cases/1D-H_slab_with_farming/

test_standalone_1D-H_slab_with_farming:
    stage: test
    only:
        - PB/feature/farming
    script:
        - cd EIRENE-sample-cases/1D-H_slab_with_farming
        - make test
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
        - EIRENE-sample-cases/1D-H_slab_with_farming/output/
        when: on_failure
    dependencies:
    - build_standalone_1D_slab_with_farming