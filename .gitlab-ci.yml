######################################################################################
# Job control
######################################################################################

image: jugit-registry.fz-juelich.de/eirene/eirene-ci-image/debianbullseye

include:
    - '.update_fork_branches.yml'
    - '.tag_and_deploy.yml'

variables:
    SERVER_DOMAIN: 'jugit.fz-juelich.de'
# For bullseye - from eirene_unified_bullseye
#   SAMPLE_CASE_VERSION: b21dec505accb8ce4a6bfb8a1044a12339615853
    SAMPLE_CASE_VERSION: 79656b9c060fc6057250065334f555c73aeee4b8
# OpenMP test cases, at present these exist in their own branch created from the
# first commit. This can be merged at any time.
    SAMPLE_CASE_VERSION_OPENMP: 8cea7bfb6a0726768e3064ca1c1983188bf752c6
# These variables allow the exclusion of certain stages to speed up development, true or false
    EXCLUDE_SERIAL: 'false'
    EXCLUDE_MPI:    'false'
    EXCLUDE_OPENMP: 'false'
    EXCLUDE_EMC3:   'false'

stages:
    - preparation
    - build:executable
    - run
    - run_mpi
    - test
    - preparation:openmp
    - build:openmp_executable
    - run_openmp
    - test_openmp
    - coverage
    - tag
    - deploy
    - on-schedule


workflow:
    name: 'EIRENE CI Pipeline for branch $CI_COMMIT_BRANCH'
    rules:
        - if:  ($CI_COMMIT_REF_NAME == 'develop' || $CI_COMMIT_REF_NAME == 'master')
          variables:
              EXCLUDE_SERIAL: 'false'
              EXCLUDE_MPI:    'false'
              EXCLUDE_OPENMP: 'false'
              EXCLUDE_EMC3:   'false'
        - if: $EXCLUDE_SERIAL == 'true'
          variables:
              EXCLUDE_EMC3: 'true'
              EXCLUDE_MPI:  'true'
        - if: $EXCLUDE_EMC3 == 'true'
          variables:
              EXCLUDE_MPI: 'true'
        - when: always

######################################################################################
# Serial tests
######################################################################################

build_library:
    stage: preparation
    rules:
        - if: $CI_PIPELINE_SOURCE == 'schedule'
          when: never
        - if: $EXCLUDE_SERIAL == 'true'
          when: never
        - when: always
    script:
        - mkdir buildRelease
        - cd buildRelease
        - FC=mpif90 cmake ../src
        - make -j EIRENE
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
            - buildRelease/
            - libRelease/

prepare_testcases:
    stage: preparation
    rules:
        - if: $CI_PIPELINE_SOURCE == 'schedule'
          when: never
        - if: $EXCLUDE_SERIAL == 'true'
          when: never
        - when: always
    script:
        # Make only shallow clone (fetch) of single commit defined by SHA key 
        - mkdir EIRENE-sample-cases
        - cd EIRENE-sample-cases
        - git init
        - git remote add origin https://gitlab-ci-token:${CI_JOB_TOKEN}@${SERVER_DOMAIN}/eirene/EIRENE-sample-cases.git
        - git fetch --depth 1 origin ${SAMPLE_CASE_VERSION}
        - git checkout FETCH_HEAD
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
            - EIRENE-sample-cases
        exclude:
            - EIRENE-sample-cases/.git/**      

.build_executable: &build_executable
    stage: build:executable
    rules:
        - if: $CI_PIPELINE_SOURCE == 'schedule'
          when: never
        - if: $EXCLUDE_SERIAL == 'true'
          when: never
        - when: always
    script:
        - cd EIRENE-sample-cases/${PATH_CASE}
        - make
    retry: 2
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
            - buildRelease/
            - libRelease/
            - EIRENE-sample-cases/${PATH_CASE}
    needs:
        - build_library
        - prepare_testcases

.build_iter_executable: &build_iter_executable
    stage: build:executable
    rules:
        - if: $CI_PIPELINE_SOURCE == 'schedule'
          when: never
        - if: $EXCLUDE_SERIAL == 'true'
          when: never
        - when: always
    script:
        - cd EIRENE-sample-cases/${PATH_CASE}
        - make -j
    retry: 2
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
            - buildRelease/
            - binRelease/
            - EIRENE-sample-cases/${PATH_CASE}
    needs:
        - build_library
        - prepare_testcases

.run: &run
    stage: run
    rules:
        - if: $CI_PIPELINE_SOURCE == 'schedule'
          when: never
        - if: $EXCLUDE_SERIAL == 'true'
          when: never
        - when: always
    script:
        - cd EIRENE-sample-cases/${PATH_CASE}
        - make output
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
            - buildRelease/
            - libRelease/
            - EIRENE-sample-cases/${PATH_CASE}
        when: always

.test: &test
    stage: test
    rules:
        - if: $CI_PIPELINE_SOURCE == 'schedule'
          when: never
        - if: $EXCLUDE_SERIAL == 'true'
          when: never
        - when: always
    script:
        - cd EIRENE-sample-cases/${PATH_CASE}
        - make test
    retry: 2
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
            - EIRENE-sample-cases/${PATH_CASE}
        when: always


