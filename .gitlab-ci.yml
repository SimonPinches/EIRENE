image: jugit-registry.fz-juelich.de/eirene/eirene-ci-image/debianbullseye

include:
    - '.update_fork_branches.yml'
    - '.tag_and_deploy.yml'

variables:
    SERVER_DOMAIN: 'jugit.fz-juelich.de'
#   SAMPLE_CASE_VERSION: 8ac380266264fe5f683ff8eb5dd42ef97ecc08cf
#   SAMPLE_CASE_VERSION: 61b21a86233636db365543f8174895036f68649d
    SAMPLE_CASE_VERSION: b588710df79bed1ecc4b5112bc284e1e3b610995
    INCLUDE_SERIAL: 'true'
    INCLUDE_MPI:    'false'
    INCLUDE_OPENMP: 'false'
    INCLUDE_EMC3:   'false'

stages:
    - preparation
    - build:executable
    - run
    - run_mpi
    - test
    - preparation:openmp
    - build:openmp_executable
    - run_openmp
    - test_openmp
    - coverage
    - tag
    - deploy
    - on-schedule

.build_executable: &build_executable
    stage: build:executable
    only:
        variables:
#            - $CI_COMMIT_REF_NAME == 'develop'
#            - $CI_COMMIT_REF_NAME == 'master'
            - $INCLUDE_SERIAL == 'true'
    except: 
        - schedules
    script:
        - cd EIRENE-sample-cases/${PATH_CASE}
        - make
    retry: 2
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
            - buildRelease/
            - libRelease/
            - EIRENE-sample-cases/${PATH_CASE}

# Create individual stage for mpi-jobs due to recource limits (memory?)
# of gitlab runner at juelich gitlab
# this forces to mpi jobs to be run sequencially
run_mpi_cases:
    stage: run_mpi
    only:
        variables:
#            - $CI_COMMIT_REF_NAME == 'develop'
#            - $CI_COMMIT_REF_NAME == 'master'
            - $INCLUDE_MPI == 'true'
    except: 
        - schedules
    before_script:
        # Bypass mpirun abort due to execution as root
        - export MPIRUN_FLAGS='--allow-run-as-root'
    script:
        # job: run_EMC3-EIRENE_H_multiStrataMpi
        - cd EIRENE-sample-cases/EMC3/W7X_Limiter/H_multiStrataMpi
        - make output
        - cd ../../../../
        # job: run_EMC3-EIRENE_H_multiStrataMpi2
        - cd EIRENE-sample-cases/EMC3/W7X_Limiter/H_multiStrataMpi2
        - make output
        - cd ../../../../
        # job: run_EMC3-EIRENE_H_multiStrataMpi3
        - cd EIRENE-sample-cases/EMC3/W7X_Limiter/H_multiStrataMpi3
        - make output
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
            - buildRelease/
            - libRelease/
            - EIRENE-sample-cases/EMC3
        when: always
    dependencies:
        - build_EMC3-EIRENE
  
.run: &run
    stage: run
    only:
        variables:
#            - $CI_COMMIT_REF_NAME == 'develop'
#            - $CI_COMMIT_REF_NAME == 'master'
            - $INCLUDE_SERIAL == 'true'
    except: 
        - schedules
    script:
        - cd EIRENE-sample-cases/${PATH_CASE}
        - make output
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
            - buildRelease/
            - libRelease/
            - EIRENE-sample-cases/${PATH_CASE}
        when: always

.test: &test
    stage: test
    only:
        variables:
#            - $CI_COMMIT_REF_NAME == 'develop'
#            - $CI_COMMIT_REF_NAME == 'master'
            - $INCLUDE_SERIAL == 'true'
    except: 
        - schedules
    script:
        - cd EIRENE-sample-cases/${PATH_CASE}
        - make test
        # - make ci_test
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
            - EIRENE-sample-cases/${PATH_CASE}
        when: always

prepare_testcases:
    stage: preparation
    except: 
        - schedules
    script:
        - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@${SERVER_DOMAIN}/eirene/EIRENE-sample-cases.git
        - cd EIRENE-sample-cases
        - git checkout ${SAMPLE_CASE_VERSION}
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
            - EIRENE-sample-cases
        exclude:
            - EIRENE-sample-cases/.git/**
      
 
build_library:
    stage: preparation
    only:
        variables:
            - $CI_COMMIT_REF_NAME == 'develop'
            - $CI_COMMIT_REF_NAME == 'master'
            - $INCLUDE_SERIAL == 'true'
    except: 
        - schedules
    script:
        - mkdir buildRelease
        - cd buildRelease
        - FC=gfortran cmake ../src
        - make EIRENE
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
            - buildRelease/
            - libRelease/

