coverage_report:
    stage: coverage
    only:
        - develop
        - master
    except:
        - schedules
    before_script:
        # Bypass mpirun abort due to execution as root
        - export MPIRUN_FLAGS='--allow-run-as-root'
    script:
        - mkdir buildCoverage
        - cd buildCoverage
        - FC=gfortran cmake ../src -DCMAKE_BUILD_TYPE=Coverage
        - make EIRENE
        - cd ..
        - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@${SERVER_DOMAIN}/eirene/EIRENE-sample-cases.git
        - cd EIRENE-sample-cases
        - git checkout ${SAMPLE_CASE_VERSION}
        - make coverageReport FFLAGS="-g -fprofile-arcs -ftest-coverage" CONFIG=Coverage
    dependencies: []
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
            - EIRENE-sample-cases/coverage.info
            - EIRENE-sample-cases/coverageReport

build_openmp_library:
    stage: preparation:openmp
#    only:
#        - $INCLUDE_OPENMP == 'true'
    except: 
        - schedules
    script:
        - mkdir buildRelease
        - cd buildRelease
        - FC=gfortran cmake ../src -DOPENMP=ON
        - make clean
        - make EIRENE
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
            - buildRelease/
            - libRelease/

prepare_openmp_testcases:
    stage: preparation:openmp
#    only:
#        - $INCLUDE_OPENMP == 'true'
    except: 
        - schedules
    script:
        - cd EIRENE-sample-cases
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
            - EIRENE-sample-cases

.build_openmp_executable: &build_openmp_executable
    stage: build:openmp_executable
#    only:
#        - $INCLUDE_OPENMP == 'true'
    except: 
        - schedules
    script:
        - cd EIRENE-sample-cases/${PATH_CASE}
        - make clean
        - make
    retry: 2
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
            - buildRelease/
            - libRelease/
            - EIRENE-sample-cases/${PATH_CASE}

.run_openmp: &run_openmp
    stage: run_openmp
#    only:
#        - $INCLUDE_OPENMP == 'true'
    except: 
        - schedules
    script:
        - cd EIRENE-sample-cases/${PATH_CASE}
        - export OMP_NUM_THREADS=4
        - make output
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
            - buildRelease/
            - libRelease/
            - EIRENE-sample-cases/${PATH_CASE}
        when: always

.test_openmp: &test_openmp
    stage: test_openmp
#    only:
#        - $INCLUDE_OPENMP == 'true'
    except: 
        - schedules
    script:
        - python --version
        - cd EIRENE-sample-cases/${PATH_CASE}
        - export OMP_NUM_THREADS=4
        - make test_openmp

