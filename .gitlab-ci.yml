image: jugit-registry.fz-juelich.de/eirene/eirene-ci-image/debianbuster

include:
    - '.update_fork_branches.yml'
    - '.tag_and_deploy.yml'

variables:
    SERVER_DOMAIN: 'jugit.fz-juelich.de'
#    SAMPLE_CASE_VERSION: 99708cb2086dba10f970584a820b20f5b30e8814  (master)
    SAMPLE_CASE_VERSION: 0b558df4d97761856fb4fa6011c2e536f9fe4af4
    INCLUDE_SERIAL: 'false'
    INCLUDE_MPI:    'false'
    INCLUDE_OPENMP: 'true'

stages:
    - preparation
    - build:executable
    - run
    - run_mpi
    - test
    - preparation:openmp
    - build:openmp_executable
    - run_openmp
    - test_openmp
    - coverage
    - tag
    - deploy
    - on-schedule

.build_executable: &build_executable
    stage: build:executable
    only:
        - $INCLUDE_SERIAL == 'true'
    except: 
        - schedules
    script:
        - cd EIRENE-sample-cases/${PATH_CASE}
        - make
    retry: 2
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
            - buildRelease/
            - libRelease/
            - EIRENE-sample-cases/${PATH_CASE}

# Create individual stage for mpi-jobs due to recource limits (memory?)
# of gitlab runner at juelich gitlab
# this forces to mpi jobs to be run sequencially
run_mpi_cases:
    stage: run_mpi
    only:
        - $INCLUDE_MPI == 'true'
    except: 
        - schedules
    before_script:
        # Bypass mpirun abort due to execution as root
        - export MPIRUN_FLAGS='--allow-run-as-root'
    script:
        # job: run_EMC3-EIRENE_H_multiStrataMpi
        - cd EIRENE-sample-cases/EMC3/W7X_Limiter/H_multiStrataMpi
        - make output
        - cd ../../../../
        # job: run_EMC3-EIRENE_H_multiStrataMpi2
        - cd EIRENE-sample-cases/EMC3/W7X_Limiter/H_multiStrataMpi2
        - make output
        - cd ../../../../
        # job: run_EMC3-EIRENE_H_multiStrataMpi3
        - cd EIRENE-sample-cases/EMC3/W7X_Limiter/H_multiStrataMpi3
        - make output
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
            - buildRelease/
            - libRelease/
            - EIRENE-sample-cases/EMC3
        when: always
    dependencies:
        - build_EMC3-EIRENE
  
.run: &run
    stage: run
    only:
        - $INCLUDE_SERIAL == 'true'
    except: 
        - schedules
    script:
        - cd EIRENE-sample-cases/${PATH_CASE}
        - make output
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
            - buildRelease/
            - libRelease/
            - EIRENE-sample-cases/${PATH_CASE}
        when: always

.test: &test
    stage: test
    only:
        - $INCLUDE_SERIAL == 'true'

    except: 
        - schedules
    script:
        - cd EIRENE-sample-cases/${PATH_CASE}
        - make test

prepare_testcases:
    stage: preparation
#    only:
#        - $INCLUDE_SERIAL == 'true'
    except: 
        - schedules
    script:
        - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@${SERVER_DOMAIN}/eirene/EIRENE-sample-cases.git
        - cd EIRENE-sample-cases
        - git checkout ${SAMPLE_CASE_VERSION}
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
            - EIRENE-sample-cases
      
 
build_library:
    stage: preparation
    only:
        - $INCLUDE_SERIAL == 'true'
    except: 
        - schedules
    script:
        - mkdir buildRelease
        - cd buildRelease
        - FC=gfortran cmake ../src
        - make EIRENE
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        paths:
            - buildRelease/
            - libRelease/

