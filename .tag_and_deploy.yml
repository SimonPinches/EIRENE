.deploy_database_hydkin: &deploy_database_hydkin
    stage: deploy
    # nice if following would work in future
    #only: 
    #    refs:
    #        - tags
    #    variables:
    #        - $CI_COMMIT_TAG =~ /^$DATABASE-.*$/
        # would be ideal to trigger job only if tag is latest
        # not (yet) supported by GitLab
        #    - $CI_COMMIT_TAG == $(git tag --sort=v:refname -l $DATABASE-* | tail -n 1)
    before_script:
        # Configure git user information
        - git config --global user.email "noreply@${SERVER_DOMAIN}"
        - git config --global user.name "GitLab CI"
        # Run ssh-agent (inside the build environment)
        - eval $(ssh-agent -s)
        # Add the required SSH keys to the agent store
        # We're using tr to fix line endings which makes ed25519 keys work
        # without extra base64 encoding.
        - echo "${SSH_KEY_HYDKIN_DEPLOY}" | tr -d '\r' | ssh-add - > /dev/null
        - echo "${SSH_KEY_WEBSITE}" | tr -d '\r' | ssh-add - > /dev/null
        # Create the SSH directory and give it the right permissions
        - mkdir -p ~/.ssh
        - chmod 700 ~/.ssh
        # Use ssh-keyscan to scan the keys of your private servers.
        - ssh-keyscan ${SERVER_DOMAIN} >> ~/.ssh/known_hosts
        - ssh-keyscan apps.fz-juelich.de >> ~/.ssh/known_hosts
        - chmod 644 ~/.ssh/known_hosts
    script:
        # Clone HYDKIN
        - git clone git@${SERVER_DOMAIN}:hydkin/hydkin.git
        # Compute HYDKIN input und html from EIRENE databases
        - cd hydkin/tex2hyd
        - TEX_FILE=../../Database/AMdata/$DATABASE.tex
        - ./ex_prog.sh -d h0 -p "$DATABASE" $TEX_FILE ./output/
        - ./ex_prog.sh -spec -p "$DATABASE" $TEX_FILE ./output/ specific
        # Commit and push changes on HYDKIN input and html
        # Upload HYDKIN input and html files on HYDKIN website
        - if [[ "$(git diff --exit-code --quiet; echo $?)" != 0 ]];
          then
            git add ../plotform/index_*.html ../inputdir*/*.txt;
            git commit -m 'Automated database update following on EIRENE repository database update.';
            git push origin;
            rsync -t -e ssh ../inputdir/* eirene@apps.fz-juelich.de:/var/www/hydkin/inputdir;
            rsync -t -e ssh ../inputdir_amjuel/* eirene@apps.fz-juelich.de:/var/www/hydkin/inputdir_amjuel;
            rsync -t -e ssh ../inputdir_hydhel/* eirene@apps.fz-juelich.de:/var/www/hydkin/inputdir_hydhel;
            rsync -t -e ssh ../plotform/index_*.html eirene@apps.fz-juelich.de:/var/www/hydkin/plotform;
          fi
        # Tag and push database update reference tag
        - git tag -a -m "$DATABASE update" $CI_COMMIT_TAG
        - git push origin $CI_COMMIT_TAG
    environment:
        name: HYDKIN/$DATABASE
        url: http://www.hydkin.de/plotform/index_$DATABASE.html

